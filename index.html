<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Throughline | Project planning tool</title>
<meta name="description" content="Throughline is a browser-based project planning tool: roadmap, milestones, backlog, sprint planning, sprint board, Gantt timeline, risk log, and delivery reports.">
<meta name="theme-color" content="#2F5BEA">
<meta property="og:type" content="website">
<meta property="og:title" content="Throughline | Project planning tool">
<meta property="og:description" content="Roadmap, sprint planning, Kanban board, Gantt timeline, risk log, and delivery reports in one place.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 22'%3E%3Crect x='1' y='3' width='12' height='4' rx='2' fill='%232F5BEA'/%3E%3Crect x='6' y='9' width='14' height='4' rx='2' fill='%232F5BEA' opacity='.6'/%3E%3Crect x='3' y='15' width='9' height='4' rx='2' fill='%232F5BEA' opacity='.35'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EDF1;--panel:#FFFFFF;--sunk:#F4F6F9;--ink:#17202B;--muted:#5B6776;--line:#D3DAE2;
  --accent:#2F5BEA;--accent-ink:#FFFFFF;--soft:#E1E8FB;
  --ok:#2E8B57;--warn:#B77C0C;--bad:#C8453B;--feat:#7A5AF8;
  --ok-soft:#DDF0E4;--warn-soft:#F7EBD1;--bad-soft:#F8DEDB;--feat-soft:#EAE4FE;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121A24;--panel:#1A2430;--sunk:#16202B;--ink:#E6ECF2;--muted:#97A5B6;--line:#2C3949;
    --accent:#7093FF;--accent-ink:#0E1522;--soft:#22305A;
    --ok:#55C08A;--warn:#E3AE43;--bad:#EE7A6E;--feat:#A48CFF;
    --ok-soft:#1C3A2B;--warn-soft:#3C3016;--bad-soft:#442423;--feat-soft:#2D2650;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121A24;--panel:#1A2430;--sunk:#16202B;--ink:#E6ECF2;--muted:#97A5B6;--line:#2C3949;
  --accent:#7093FF;--accent-ink:#0E1522;--soft:#22305A;
  --ok:#55C08A;--warn:#E3AE43;--bad:#EE7A6E;--feat:#A48CFF;
  --ok-soft:#1C3A2B;--warn-soft:#3C3016;--bad-soft:#442423;--feat-soft:#2D2650;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.45 "Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
h1{font-size:1.25rem}h2{font-size:1.1rem}h3{font-size:.95rem}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.muted{color:var(--muted)}
.small{font-size:.82rem}

#app{display:grid;grid-template-columns:212px minmax(0,1fr);height:100%}
#nav{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px;font-weight:700;font-size:1.05rem}
.brand svg{flex:none}
.navgroup{margin-bottom:14px}
.navgroup>span{display:block;font-size:.78rem;color:var(--muted);padding:0 10px 4px}
.navbtn{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;
  text-align:left;padding:7px 10px;border-radius:7px;cursor:pointer;color:var(--ink)}
.navbtn:hover{background:var(--sunk)}
.navbtn[aria-current="page"]{background:var(--soft);color:var(--accent);font-weight:600}
.navbtn .count{font-size:.75rem;background:var(--bad);color:#fff;border-radius:10px;padding:0 7px;line-height:18px}
#mainwrap{overflow:auto;min-width:0}
#top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 24px;border-bottom:1px solid var(--line);
  background:var(--panel);position:sticky;top:0;z-index:20}
#top .proj{border:0;background:none;padding:0;cursor:pointer;text-align:left}
#top .proj small{display:block;color:var(--muted);font-size:.8rem}
#top .sp{flex:1}
#main{padding:22px 24px 60px;max-width:1320px}

.btn{border:1px solid var(--line);background:var(--panel);padding:7px 13px;border-radius:7px;cursor:pointer;
  font-weight:550;white-space:nowrap;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:transparent;background:transparent}
.btn.sm{padding:4px 9px;font-size:.84rem;font-weight:500}
.btn:disabled{opacity:.5;cursor:not-allowed}

.viewhead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.viewhead h1{font-size:1.45rem}
.viewhead p{color:var(--muted);max-width:62ch}
.viewhead .sp{flex:1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.stack>*+*{margin-top:16px}
.panel h2+*{margin-top:12px}
.phead{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:12px}
.phead h2{font-size:1rem}

/* dashboard hero */
.hero{padding:22px 24px}
.hero-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.hero-head h2{font-size:1.6rem;letter-spacing:-.02em}
.hero-day{font-size:.95rem;color:var(--muted);text-align:right}
.hero-day b{display:block;font-size:2.4rem;line-height:1;color:var(--ink);letter-spacing:-.03em}
.hero-body{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:24px;margin-top:14px;align-items:start}
.kpis{display:grid;gap:14px}
.kpi b{display:block;font-size:1.5rem;letter-spacing:-.02em;line-height:1.1}
.kpi span{color:var(--muted);font-size:.84rem}
.signal{margin-top:12px;padding:9px 12px;border-radius:7px;font-weight:550}
.signal.ok{background:var(--ok-soft);color:var(--ok)}
.signal.warn{background:var(--warn-soft);color:var(--warn)}
.signal.bad{background:var(--bad-soft);color:var(--bad)}

.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.legend i.dash{background:repeating-linear-gradient(90deg,var(--muted) 0 4px,transparent 4px 7px)!important}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;padding:1px 8px;border-radius:20px;
  background:var(--sunk);border:1px solid var(--line);white-space:nowrap;line-height:18px}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.feat{background:var(--feat-soft);color:var(--feat);border-color:transparent}
.chip.acc{background:var(--soft);color:var(--accent);border-color:transparent}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.tt{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;color:var(--muted);white-space:nowrap}
.tt::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--c)}
.tt-story{--c:var(--accent)}.tt-task{--c:var(--muted)}.tt-bug{--c:var(--bad)}.tt-feature{--c:var(--feat)}
.pbadge{font-size:.75rem;font-weight:650;padding:0 6px;border-radius:4px;line-height:18px}
.pri-P0{background:var(--bad);color:#fff}.pri-P1{background:var(--warn-soft);color:var(--warn)}
.pri-P2{background:var(--sunk);color:var(--muted)}.pri-P3{color:var(--muted)}
.pts{font-size:.78rem;font-weight:650;min-width:24px;text-align:center;background:var(--sunk);border-radius:10px;padding:0 6px;line-height:20px}
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:.68rem;font-weight:700;color:#fff;flex:none}
.av.none{background:var(--sunk);color:var(--muted);border:1px dashed var(--line)}
.key{font-size:.8rem;color:var(--muted);font-weight:600;white-space:nowrap}
.link{border:0;background:none;padding:0;cursor:pointer;text-align:left;color:var(--ink)}
.link:hover{color:var(--accent);text-decoration:underline}

/* bars */
.meter{height:8px;background:var(--sunk);border-radius:6px;overflow:hidden;position:relative}
.meter>i{display:block;height:100%;background:var(--accent);border-radius:6px}
.meter.over>i{background:var(--bad)}
.meter.hi>i{background:var(--warn)}

/* tables */
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{text-align:left;font-weight:600;color:var(--muted);font-size:.8rem;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}

/* backlog */
.bsec{padding:0;overflow:hidden}
.bsec.over-drop{outline:2px dashed var(--accent);outline-offset:-2px}
.bhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;background:var(--sunk);border-bottom:1px solid var(--line)}
.bhead h2{font-size:1rem}
.bhead .sp{flex:1}
.bhead .meter{width:140px}
.trow{display:grid;grid-template-columns:16px 70px minmax(0,1fr) auto auto auto 24px 130px;gap:10px;align-items:center;
  padding:7px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.trow:last-child{border-bottom:0}
.trow.dragging{opacity:.4}
.trow.drop-before{box-shadow:inset 0 2px 0 var(--accent)}
.handle{cursor:grab;color:var(--muted);font-size:.8rem;letter-spacing:-2px;user-select:none}
.trow .ttl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow select{font-size:.82rem;padding:3px 4px;border:1px solid var(--line);border-radius:6px;background:var(--panel);max-width:130px}
.epicchip{font-size:.75rem;padding:1px 7px;border-radius:5px;background:color-mix(in srgb,var(--ec) 16%,transparent);color:var(--ink);white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.empty{padding:22px 16px;color:var(--muted);text-align:center}

/* board */
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:320px}
.col.over-drop{outline:2px dashed var(--accent);outline-offset:-2px}
.colhead{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 10px;font-weight:600}
.colhead .wip{font-size:.78rem;color:var(--muted);font-weight:500}
.colhead .wip.bad{color:var(--bad);font-weight:650}
.card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:8px;padding:10px 11px;margin-bottom:8px;cursor:grab}
.card:hover{border-color:var(--muted);border-left-color:var(--c)}
.card.dragging{opacity:.4}
.card .ctop{display:flex;justify-content:space-between;gap:8px;align-items:center}
.card .ctitle{margin:6px 0 9px;font-weight:550;line-height:1.3}
.card .cfoot{display:flex;align-items:center;gap:6px}
.card .cfoot .sp{flex:1}
.blocked{font-size:.74rem;color:var(--bad);font-weight:600}

/* roadmap */
.roadwrap{overflow-x:auto}
.road{min-width:780px}
.rrow{display:grid;grid-template-columns:230px minmax(0,1fr);align-items:stretch;border-bottom:1px solid var(--line)}
.rrow:last-child{border-bottom:0}
.rlabel{padding:10px 12px 10px 0}
.rlabel b{display:block;font-weight:600}
.rtrack{position:relative;min-height:52px}
.rhead .rtrack{min-height:28px}
.mline{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
.mlabel{position:absolute;top:4px;font-size:.78rem;color:var(--muted);padding-left:6px;white-space:nowrap}
.today{position:absolute;top:0;bottom:0;border-left:2px solid var(--bad);z-index:2}
.rbar{position:absolute;top:13px;height:26px;border-radius:6px;background:color-mix(in srgb,var(--ec) 22%,transparent);
  border:1px solid color-mix(in srgb,var(--ec) 60%,transparent);cursor:pointer;overflow:hidden;padding:0}
.rbar>i{position:absolute;inset:0 auto 0 0;background:var(--ec);opacity:.85}
.rbar>span{position:relative;font-size:.78rem;font-weight:650;padding:0 8px;line-height:24px;white-space:nowrap;color:var(--ink)}
.diamond{position:absolute;top:16px;width:14px;height:14px;transform:translateX(-7px) rotate(45deg);background:var(--ink);border:0;padding:0;cursor:pointer}
.diamond.bad{background:var(--bad)}.diamond.ok{background:var(--ok)}
.dlabel{position:absolute;top:32px;font-size:.74rem;white-space:nowrap;transform:translateX(-50%);color:var(--muted)}

/* gantt */
.gscroll{overflow:auto;max-height:calc(100vh - 230px);border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.gantt{position:relative}
.grow{display:flex;height:34px;border-bottom:1px solid var(--line)}
.grow.ghdr{height:26px;background:var(--sunk)}
.glabel{position:sticky;left:0;z-index:4;width:250px;flex:none;background:var(--panel);border-right:1px solid var(--line);
  display:flex;align-items:center;gap:8px;padding:0 10px;overflow:hidden;white-space:nowrap}
.ghdr .glabel{background:var(--sunk);font-size:.78rem;color:var(--muted)}
.grow.epic .glabel{font-weight:650}
.grow.epic{background:var(--sunk)}
.grow.epic .glabel{background:var(--sunk)}
.glabel .ttl{overflow:hidden;text-overflow:ellipsis}
.gtrack{position:relative;flex:none}
.gday{position:absolute;top:0;height:26px;font-size:.7rem;color:var(--muted);text-align:center;line-height:26px}
.gday.we{background:color-mix(in srgb,var(--line) 45%,transparent)}
.gsprint{position:absolute;top:0;height:26px;font-size:.74rem;font-weight:600;padding-left:6px;line-height:26px;border-left:1px solid var(--muted);white-space:nowrap;overflow:hidden}
.gbar{position:absolute;top:6px;height:22px;border-radius:5px;background:var(--accent);color:var(--accent-ink);font-size:.72rem;font-weight:650;
  padding:0 8px;line-height:22px;cursor:grab;touch-action:none;user-select:none;overflow:hidden;white-space:nowrap;z-index:2}
.gbar.s-done{background:var(--ok)}
.gbar.s-inprogress,.gbar.s-review{background:var(--accent)}
.gbar.s-todo,.gbar.s-backlog{background:color-mix(in srgb,var(--accent) 45%,var(--panel));color:var(--ink)}
.gbar.late{box-shadow:0 0 0 2px var(--bad)}
.gbar .grip{position:absolute;right:0;top:0;bottom:0;width:9px;cursor:ew-resize;background:linear-gradient(90deg,transparent,rgba(0,0,0,.18))}
.gsum{position:absolute;top:13px;height:8px;border-radius:4px;background:var(--ec)}
.gover{position:absolute;left:0;top:0;pointer-events:none;z-index:3}

/* capacity heat */
.heat td{text-align:center;font-weight:600;font-size:.84rem}
.heat td.h0{color:var(--muted)}
.heat td.h1{background:var(--ok-soft);color:var(--ok)}
.heat td.h2{background:var(--warn-soft);color:var(--warn)}
.heat td.h3{background:var(--bad-soft);color:var(--bad)}
.heat td:first-child{text-align:left;font-weight:500}

/* planning gauge */
.gauge{position:relative;height:30px;background:var(--sunk);border-radius:8px;margin:26px 0 30px}
.gauge>i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:8px}
.gauge>i.over{background:var(--bad)}
.gmark{position:absolute;top:-8px;bottom:-8px;border-left:2px dashed var(--ink)}
.gmark span{position:absolute;white-space:nowrap;font-size:.76rem;transform:translateX(-50%)}
.gmark.top span{top:-18px}.gmark.bot span{bottom:-20px}

/* risks */
.rgrid{display:grid;grid-template-columns:auto repeat(3,1fr);grid-template-rows:repeat(3,64px) auto;gap:4px;max-width:360px}
.rcell{border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:1.1rem}
.rcell.s1{background:var(--ok-soft);color:var(--ok)}.rcell.s2{background:var(--warn-soft);color:var(--warn)}.rcell.s3{background:var(--bad-soft);color:var(--bad)}
.rcell.zero{opacity:.45}
.raxis{font-size:.75rem;color:var(--muted);display:grid;place-items:center}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile b{display:block;font-size:1.45rem;letter-spacing:-.02em}
.tile span{font-size:.82rem;color:var(--muted)}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters select,.filters input,.selectlike{padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--panel)}
.filters input{min-width:200px}

.list1>li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.list1{list-style:none;margin:0;padding:0}
.list1>li:last-child{border-bottom:0}
.list1 .sp{flex:1;min-width:0}

.mscard{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:18px;align-items:start}
.msdate b{display:block;font-size:1.5rem;letter-spacing:-.02em;line-height:1.1}


/* overview */
.ovhero{padding:24px 26px 30px;margin-bottom:16px}
.ovtop{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;flex-wrap:wrap}
.ovname{font-size:2.1rem;letter-spacing:-.03em;line-height:1.1;margin-top:2px}
.ovdesc{margin-top:6px;max-width:64ch;font-size:1.02rem}
.ovhealth{border-radius:10px;padding:10px 16px;min-width:150px}
.ovhealth span{display:block;font-size:.8rem;opacity:.85}
.ovhealth b{font-size:1.35rem;letter-spacing:-.02em}
.ovhealth{background:var(--sunk)}.ovhealth.ok{background:var(--ok-soft);color:var(--ok)}.ovhealth.warn{background:var(--warn-soft);color:var(--warn)}.ovhealth.bad{background:var(--bad-soft);color:var(--bad)}
.ovstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.ovstats b{display:block;font-size:1.45rem;letter-spacing:-.02em;line-height:1.15}
.ovstats span{font-size:.82rem;color:var(--muted)}
.mstrip{position:relative;height:118px;margin:22px 8px 0}
.mtrack{position:absolute;left:0;right:0;top:56px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.mtrack i{display:block;height:100%;background:var(--accent)}
.mtoday{position:absolute;top:66px;transform:translateX(-50%);font-size:.72rem;color:var(--accent)}
.mtoday::before{content:"";position:absolute;left:50%;top:-14px;height:10px;border-left:2px solid var(--accent)}
.mpt{position:absolute;top:50px;width:18px;height:18px;border-radius:50%;transform:translateX(-50%);border:3px solid var(--panel);background:var(--muted);cursor:pointer;padding:0;box-shadow:0 0 0 1px var(--line)}
.mpt.ok{background:var(--ok)}.mpt.warn{background:var(--warn)}.mpt.bad{background:var(--bad)}
.mlab{position:absolute;transform:translateX(-50%);text-align:center;white-space:nowrap;font-size:.8rem;line-height:1.25}
.mlab span{display:block;color:var(--muted);font-size:.75rem}
.mlab.up{top:4px}.mlab.dn{top:84px}
.mlab:first-of-type{transform:translateX(-20%)}
.ovgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:980px){.ovgrid{grid-template-columns:1fr}}


/* portfolio */
.projsel{display:block;padding:8px 10px 2px;font-size:.78rem;color:var(--muted)}
.projsel select{display:block;width:100%;margin-top:4px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--sunk);color:var(--ink);font-size:.9rem;font-weight:600}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.pcard h2{font-size:1.15rem;margin-top:2px}
.pdesc{max-width:60ch}
.pfacts{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;margin:14px 0;font-size:.88rem}
.pfacts dt{color:var(--muted)}.pfacts dd{margin:0}
.pteam{display:flex;gap:4px;flex-wrap:wrap}

/* welcome */
.btn.lg{padding:10px 20px;font-size:1rem}
.welcome{max-width:760px;margin:4vh auto 0;padding:34px 36px}
.welcome h1{font-size:2rem;letter-spacing:-.03em;line-height:1.15;margin:4px 0 10px}
.welcome .lead{font-size:1.05rem;color:var(--muted);max-width:58ch}
.welcome .row{margin:22px 0 4px}
.wfeat{list-style:none;margin:26px 0 0;padding:22px 0 0;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px 26px}
.wfeat b{display:block;margin-bottom:2px}
.wfeat span{color:var(--muted);font-size:.88rem}
.welcome .fine{margin-top:24px}

/* modal */
#modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px}
#modal[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(10,16,24,.5)}
.dialog{position:relative;background:var(--panel);border-radius:12px;width:min(640px,100%);max-height:calc(100% - 20px);overflow:auto;border:1px solid var(--line)}
.dialog header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.dialog .x{border:0;background:none;font-size:1.5rem;line-height:1;cursor:pointer;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;padding:16px 20px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:.84rem;color:var(--muted);min-width:0}
.fld.wide{grid-column:1/-1}
.fld input,.fld select,.fld textarea{padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--sunk);color:var(--ink);font-size:.93rem;width:100%}
.fld small{font-size:.76rem}
.dnote{padding:0 20px 12px;font-size:.88rem;color:var(--muted)}
.dnote p+p{margin-top:6px}
.dialog footer{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--panel)}
.dialog footer .sp{flex:1}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);
  padding:10px 16px;border-radius:8px;font-weight:550;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}

.setup{max-width:560px;margin:8vh auto;padding:30px}
.setup h1{font-size:1.8rem;letter-spacing:-.02em;margin-bottom:8px}
.setup .fgrid{padding:18px 0}
.setup .row{display:flex;gap:10px;flex-wrap:wrap}

@media (max-width:860px){
  #app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  #nav{border-right:0;border-bottom:1px solid var(--line);padding:8px;display:flex;gap:4px;overflow-x:auto;overflow-y:hidden;white-space:nowrap}
  .brand{padding:6px 10px 6px 4px}
  .brand span{display:none}
  .navgroup{display:flex;margin:0}
  .navgroup>span{display:none}
  .navbtn{width:auto;gap:6px}
  #top{position:static;padding:12px 16px}
  #main{padding:16px 14px 50px}
  .hero-body{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .trow{grid-template-columns:62px minmax(0,1fr) auto 24px;row-gap:4px}
  .trow .handle,.trow .epicchip,.trow .pbadge{display:none}
  .trow select{grid-column:1/-1;max-width:none}
  .fgrid{grid-template-columns:1fr}
  .mscard{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <aside id="nav" aria-label="Views"></aside>
  <div id="mainwrap">
    <header id="top"></header>
    <main id="main"><noscript><p class="muted" style="padding:40px 0">Throughline needs JavaScript to run.</p></noscript></main>
  </div>
</div>
<div id="modal" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- utilities ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const DAY=864e5;
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((parse(b)-parse(a))/DAY);
const TODAY=iso(new Date());
const fmtD=s=>s?parse(s).toLocaleDateString(undefined,{month:'short',day:'numeric'}):'—';
const fmtDY=s=>s?parse(s).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):'—';
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);
function workdays(a,b){let n=0;for(let d=a;d<=b;d=addDays(d,1)){const w=parse(d).getDay();if(w&&w<6)n++}return n}
const plural=(n,w)=>n+' '+w+(n===1?'':'s');

/* ---------- constants ---------- */
const STATUSES=[['triage','Triage'],['backlog','Backlog'],['todo','To do'],['inprogress','In progress'],['review','In review'],['done','Done']];
const STL=Object.fromEntries(STATUSES);
const TYPES=[['story','Story'],['task','Task'],['bug','Bug'],['feature','Feature request']];
const TYL=Object.fromEntries(TYPES);
const PRI=[['P0','P0 Urgent'],['P1','P1 High'],['P2','P2 Medium'],['P3','P3 Low']];
const SEV=[['critical','Critical'],['major','Major'],['minor','Minor'],['trivial','Trivial']];
const COLORS=[['#2F5BEA','Cobalt'],['#7A5AF8','Violet'],['#0E9384','Teal'],['#C98A12','Amber'],['#C8453B','Brick'],['#3F7D20','Moss'],['#B4467D','Plum'],['#4B5B6E','Slate']];
const RAID=[['risk','Risk'],['assumption','Assumption'],['issue','Issue'],['dependency','Dependency']];

/* ---------- state ---------- */
let PS={};       // projects by id: {id, project, members, sprints, epics, milestones, risks, nextNum}
let PT={};       // tickets by project id, then by ticket id
let S=null;      // the current project
let T={};        // the current project's tickets
const UI={cur:null,view:'dashboard',tf:{type:'all',status:'open',q:''},bq:'',boardWho:'',planSprint:null,reportSprint:null,gZoom:22,dragId:null};
const projOrder=()=>Object.keys(PS).filter(id=>PS[id]&&PS[id].project).sort((a,b)=>String(PS[a].createdAt||'').localeCompare(String(PS[b].createdAt||''))||PS[a].project.name.localeCompare(PS[b].project.name));
function syncCur(){
  if(!UI.cur||!PS[UI.cur])UI.cur=projOrder()[0]||null;
  S=UI.cur?PS[UI.cur]:null;
  if(UI.cur){PT[UI.cur]=PT[UI.cur]||{};T=PT[UI.cur]}else T={};
  try{localStorage.setItem(LS_CUR,UI.cur||'')}catch(e){}
}
function switchProject(pid){UI.cur=pid;UI.planSprint=null;UI.reportSprint=null;UI.boardWho='';UI.bq='';syncCur()}
function withProject(pid,fn){const s0=S,t0=T;S=PS[pid];T=PT[pid]||{};try{return fn()}finally{S=s0;T=t0}}

/* ---------- persistence ---------- */
const LS='throughline:v2',LS_CUR='throughline:cur';
let saveWarned=false;
function localLoad(){
  try{const j=JSON.parse(localStorage.getItem(LS)||'null');if(j&&j.PS){PS=j.PS;PT=j.PT||{}}}catch(e){}
  try{UI.cur=localStorage.getItem(LS_CUR)||null}catch(e){}
  syncCur();
}
function localSave(){
  try{localStorage.setItem(LS,JSON.stringify({PS,PT}))}
  catch(e){if(!saveWarned){saveWarned=true;toast('This browser is blocking storage, so your changes won’t survive a reload.')}}
}
function saveWs(){if(S)localSave()}
function saveT(t){T[t.id]=t;localSave()}
function delT(id){delete T[id];localSave()}
function deleteProject(pid){
  const name=PS[pid]?PS[pid].project.name:'Project';delete PS[pid];delete PT[pid];localSave();
  UI.cur=null;syncCur();UI.view=S?'dashboard':'portfolio';render();toast(name+' deleted');
}

/* ---------- model helpers ---------- */
const tickets=()=>Object.values(T);
const byId=(arr,id)=>arr.find(x=>x.id===id);
const member=id=>byId(S.members,id);
const activeSprint=()=>S.sprints.find(s=>s.status==='active');
const sortedSprints=()=>[...S.sprints].sort((a,b)=>a.start<b.start?-1:a.start>b.start?1:0);
const sprintTickets=sid=>tickets().filter(t=>t.sprintId===sid);
const pts=a=>a.reduce((s,t)=>s+(+t.points||0),0);
const isDone=t=>t.status==='done';
const maxRank=()=>tickets().reduce((m,t)=>Math.max(m,+t.rank||0),0);
const byRank=(a,b)=>(a.rank||0)-(b.rank||0);
function memberAvail(m,s){const wd=workdays(s.start,s.end)||1;const off=(m.timeOff||{})[s.id]||0;return Math.round((+m.capacity||0)*Math.max(0,1-off/wd))}
function sprintCap(s){return S.members.reduce((a,m)=>a+memberAvail(m,s),0)}
function velocity(){const c=sortedSprints().filter(s=>s.status==='closed').slice(-3);return c.length?Math.round(c.reduce((a,s)=>a+(+s.completed||0),0)/c.length):0}
function burn(s){
  if(s.status==='closed'&&s.burn)return s.burn;
  const ts=sprintTickets(s.id),total=pts(ts),len=diff(s.start,s.end),out=[];
  for(let i=0;i<=len;i++){const d=addDays(s.start,i);if(d>TODAY)break;out.push(total-pts(ts.filter(t=>isDone(t)&&t.doneAt&&t.doneAt<=d)))}
  return out;
}
function setStatus(t,st){
  t.status=st;
  if(st==='done'){if(!t.doneAt)t.doneAt=TODAY}else t.doneAt=null;
  if((st==='inprogress'||st==='review'||st==='done')&&!t.startedAt)t.startedAt=TODAY;
}
function moveToSprint(t,sid){
  t.sprintId=sid||null;
  if(sid&&(t.status==='backlog'||t.status==='triage'))t.status='todo';
  if(!sid&&!isDone(t)&&t.status!=='triage')t.status='backlog';
}
function blockers(t){return (t.deps||[]).map(id=>T[id]).filter(d=>d&&!isDone(d))}
function epicProgress(e){const ts=tickets().filter(t=>t.epicId===e.id&&t.status!=='triage');const tot=pts(ts),d=pts(ts.filter(isDone));return {tot,done:d,pct:tot?Math.round(d/tot*100):0,count:ts.length}}
function forecast(epicIds){
  const ts=tickets().filter(t=>epicIds.includes(t.epicId)&&t.status!=='triage');
  const rem=pts(ts.filter(t=>!isDone(t)));
  if(!rem)return {rem:0,date:null};
  const v=velocity();if(!v)return {rem,date:null};
  const a=activeSprint();const anchor=a?a.start:TODAY;
  return {rem,date:addDays(anchor,Math.ceil(rem/v)*14-1)};
}
function msStatus(m){
  const own=S.epics.filter(e=>e.milestoneId===m.id);
  const cum=S.epics.filter(e=>{const mm=byId(S.milestones,e.milestoneId);return mm&&mm.date<=m.date}).map(e=>e.id);
  const f=forecast(cum);
  const prog=own.reduce((a,e)=>{const p=epicProgress(e);a.tot+=p.tot;a.done+=p.done;return a},{tot:0,done:0});
  let st,cls;
  if(prog.tot&&prog.done===prog.tot){st='Complete';cls='ok'}
  else if(m.date<TODAY){st='Missed';cls='bad'}
  else if(!f.date){st=velocity()?'On track':'No velocity yet';cls=velocity()?'ok':''}
  else if(f.date<=m.date){st='On track';cls='ok'}
  else if(diff(m.date,f.date)<=7){st='At risk';cls='warn'}
  else {st='Off track';cls='bad'}
  return {st,cls,f,own,prog,pct:prog.tot?Math.round(prog.done/prog.tot*100):0};
}

/* ---------- small renderers ---------- */
function av(id){const m=id&&member(id);if(!m)return '<span class="av none" title="Unassigned">–</span>';const ini=m.name.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();return `<span class="av" style="background:${esc(m.color)}" title="${esc(m.name)}">${esc(ini)}</span>`}
const ttag=t=>`<span class="tt tt-${t.type}">${esc(TYL[t.type]||t.type)}</span>`;
const pri=p=>`<span class="pbadge pri-${esc(p)}">${esc(p)}</span>`;
function epicChip(id){const e=id&&byId(S.epics,id);return e?`<span class="epicchip" style="--ec:${esc(e.color)}">${esc(e.title)}</span>`:''}
const sevChip=s=>s?`<span class="chip ${s==='critical'?'bad':s==='major'?'warn':''}">${esc(s[0].toUpperCase()+s.slice(1))}</span>`:'';
function meter(val,max){const p=max?Math.min(100,val/max*100):0;const cls=max&&val>max?'over':max&&val>max*.9?'hi':'';return `<div class="meter ${cls}"><i style="width:${p}%"></i></div>`}
function legend(items){return `<div class="legend">${items.map(([c,l,d])=>`<span><i class="${d?'dash':''}" style="background:${c}"></i>${esc(l)}</span>`).join('')}</div>`}
function niceMax(v){if(v<=0)return {max:4,step:1};const raw=v/4,p=Math.pow(10,Math.floor(Math.log10(raw))),n=raw/p;const s=(n<=1?1:n<=2?2:n<=5?5:10)*p;return {max:Math.ceil(v/s)*s,step:s}}

function svgLine({w=640,h=230,labels,series,ymax}){
  const pl=36,pr=12,pt=12,pb=28,n=labels.length;const {max,step}=niceMax(ymax||1);
  const x=i=>pl+i*(w-pl-pr)/Math.max(1,n-1),y=v=>pt+(h-pt-pb)*(1-v/max);
  let g='';for(let v=0;v<=max+1e-9;v+=step){g+=`<line x1="${pl}" x2="${w-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-7}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${Math.round(v)}</text>`}
  const k=Math.ceil(n/7);labels.forEach((l,i)=>{if(i%k===0||i===n-1)g+=`<text x="${x(i)}" y="${h-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(l)}</text>`});
  series.forEach(s=>{if(!s.vals.length)return;const d=s.vals.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.dash?1.5:2.5}" ${s.dash?'stroke-dasharray="5 4"':''} stroke-linejoin="round" stroke-linecap="round"/>`;
    if(s.dots)s.vals.forEach((v,i)=>{g+=`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="var(--panel)" stroke="${s.color}" stroke-width="2"><title>${esc(labels[i])}: ${Math.round(v)}</title></circle>`})});
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(series.map(s=>s.name).join(' vs '))}">${g}</svg>`;
}
function svgBars({w=640,h=230,groups,avg,ymax}){
  const pl=36,pr=12,pt=14,pb=28;const {max,step}=niceMax(ymax||1);const y=v=>pt+(h-pt-pb)*(1-v/max);
  const n=groups.length||1,gw=(w-pl-pr)/n;let g='';
  for(let v=0;v<=max+1e-9;v+=step)g+=`<line x1="${pl}" x2="${w-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-7}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${Math.round(v)}</text>`;
  groups.forEach((gr,i)=>{const k=gr.vals.length,bw=Math.min(26,gw*.7/k),x0=pl+i*gw+(gw-bw*k-4*(k-1))/2;
    gr.vals.forEach((b,j)=>{const bx=x0+j*(bw+4);g+=`<rect x="${bx}" y="${y(b.v)}" width="${bw}" height="${y(0)-y(b.v)}" rx="3" fill="${b.color}"><title>${esc(gr.label)}: ${b.v}</title></rect><text x="${bx+bw/2}" y="${y(b.v)-4}" text-anchor="middle" font-size="10" fill="var(--muted)">${b.v}</text>`});
    g+=`<text x="${pl+i*gw+gw/2}" y="${h-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(gr.label)}</text>`});
  if(avg)g+=`<line x1="${pl}" x2="${w-pr}" y1="${y(avg)}" y2="${y(avg)}" stroke="var(--ink)" stroke-dasharray="5 4"/><text x="${w-pr}" y="${y(avg)-5}" text-anchor="end" font-size="11" fill="var(--ink)">avg ${avg}</text>`;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Bar chart">${g}</svg>`;
}

/* ---------- views ---------- */
const NAV=[
  ['Overview',[['dashboard','Project overview']]],
  ['Plan',[['roadmap','Roadmap'],['gantt','Timeline'],['milestones','Milestones']]],
  ['Execute',[['backlog','Backlog'],['planning','Sprint planning'],['board','Sprint board']]],
  ['Track',[['tickets','Bugs & requests'],['capacity','Team capacity'],['risks','Risks'],['reports','Reports']]]
];
const VIEWS={dashboard:vDash,roadmap:vRoadmap,gantt:vGantt,milestones:vMilestones,backlog:vBacklog,planning:vPlanning,board:vBoard,tickets:vTickets,capacity:vCapacity,risks:vRisks,reports:vReports};

function head(title,desc,actions=''){return `<div class="viewhead"><div><h1>${esc(title)}</h1>${desc?`<p>${desc}</p>`:''}</div><span class="sp"></span>${actions}</div>`}

function sprintPulse(s){
  const ts=sprintTickets(s.id),total=pts(ts),done=pts(ts.filter(isDone)),len=diff(s.start,s.end)+1;
  const day=Math.min(len,Math.max(0,diff(s.start,TODAY)+1)),b=burn(s),committed=+s.committed||total;
  const ideal=[...Array(len)].map((_,i)=>committed*(1-i/(len-1)));
  const labels=[...Array(len)].map((_,i)=>fmtD(addDays(s.start,i)));
  const cur=b.length?b[b.length-1]:total,exp=committed*(1-Math.max(0,b.length-1)/(len-1)),gap=Math.round(cur-exp),added=total-committed;
  let sig,cls;
  if(!b.length){sig='This sprint hasn’t reached its first day yet.';cls='ok'}
  else if(gap>Math.max(3,committed*.12)){sig=`${plural(gap,'point')} behind the ideal line with ${plural(len-day,'day')} left.`;cls='bad'}
  else if(gap>0){sig=`Slightly behind: ${plural(gap,'point')} above the ideal line.`;cls='warn'}
  else {sig='On pace to finish the sprint commitment.';cls='ok'}
  if(added>0)sig+=` Scope grew by ${plural(added,'point')} since it started.`;
  return {ts,total,done,len,day,b,committed,ideal,labels,sig,cls};
}
function attentionItems(){
  const out=[],a=activeSprint();
  const crit=tickets().filter(t=>t.type==='bug'&&t.severity==='critical'&&!isDone(t));
  crit.forEach(t=>out.push(['bad',`Critical bug: ${t.title}`,t.status==='triage'?'Still in triage':(t.assignee?'Assigned to '+member(t.assignee)?.name:'Unassigned'),'ticket',t.id]));
  S.milestones.forEach(m=>{const r=msStatus(m);if(r.cls==='bad'||r.cls==='warn')out.push([r.cls,`${m.title} is ${r.st.toLowerCase()}`,r.f.date?`Forecast ${fmtD(r.f.date)} vs. target ${fmtD(m.date)}`:`Target ${fmtD(m.date)}`,'milestone',m.id])});
  if(a){
    sprintTickets(a.id).filter(t=>!isDone(t)&&blockers(t).length).forEach(t=>out.push(['warn',`${t.key} is blocked`,`Waiting on ${blockers(t).map(b=>b.key).join(', ')}`,'ticket',t.id]));
    S.members.forEach(m=>{const as=pts(sprintTickets(a.id).filter(t=>t.assignee===m.id)),c=memberAvail(m,a);if(as>c)out.push(['warn',`${m.name} is overbooked`,`${as} points assigned, ${c} available this sprint`,'go','planning'])});
    const un=sprintTickets(a.id).filter(t=>!t.assignee&&!isDone(t));if(un.length)out.push(['warn',`${plural(un.length,'sprint ticket')} unassigned`,un.map(t=>t.key).join(', '),'go','board']);
  }
  tickets().filter(t=>!isDone(t)&&t.due&&t.due<TODAY&&t.status!=='triage').forEach(t=>out.push(['warn',`${t.key} is overdue`,`Was due ${fmtD(t.due)}`,'ticket',t.id]));
  const tri=tickets().filter(t=>t.status==='triage').length;if(tri)out.push(['',`${plural(tri,'item')} waiting in triage`,'Review new bugs and feature requests','go','tickets']);
  const rank={bad:0,warn:1,'':2};return out.sort((x,y)=>rank[x[0]]-rank[y[0]]);
}
function projectHealth(){
  if(!tickets().length&&!S.milestones.length)return ['','Not started'];
  const a=activeSprint(),p=a?sprintPulse(a):null,st=S.milestones.map(msStatus);
  if(st.some(r=>r.cls==='bad')||(p&&p.cls==='bad'))return ['bad','Off track'];
  if(st.some(r=>r.cls==='warn')||(p&&p.cls==='warn'))return ['warn','At risk'];
  return ['ok','On track'];
}
function vDash(){
  const a=activeSprint(),v=velocity(),[hcls,hl]=projectHealth();
  const all=tickets().filter(t=>t.status!=='triage'),totP=pts(all),doneP=pts(all.filter(isDone)),pct=totP?Math.round(doneP/totP*100):0;
  const msSorted=[...S.milestones].sort((x,y)=>x.date<y.date?-1:1),final=msSorted[msSorted.length-1];
  const first=[...S.sprints.map(s=>s.start),...S.epics.map(e=>e.start),TODAY].sort()[0];

  const team=S.members.map(m=>{const as=a?pts(sprintTickets(a.id).filter(t=>t.assignee===m.id)):0,c=a?memberAvail(m,a):+m.capacity||0;return `<li>${av(m.id)}<div class="sp"><div class="small" style="display:flex;justify-content:space-between;gap:8px"><span>${esc(m.name)} <span class="muted">${esc(m.role||'')}</span></span>${a?`<span class="muted">${as} / ${c} pts</span>`:''}</div>${a?meter(as,c):''}</div></li>`}).join('');

function vRoadmap(){
  const act=`<button class="btn" data-act="new-milestone">Add milestone</button><button class="btn pri" data-act="new-epic">Add epic</button>`;
  if(!S.epics.length)return head('Roadmap','Epics laid out over time, with milestones on top.',act)+`<div class="panel empty">No epics yet. Add an epic to start shaping the roadmap.</div>`;
  const dates=[...S.epics.flatMap(e=>[e.start,e.end]),...S.milestones.map(m=>m.date),TODAY].filter(Boolean).sort();
  let a=dates[0],b=dates[dates.length-1];a=a.slice(0,8)+'01';const bd=parse(b);b=iso(new Date(bd.getFullYear(),bd.getMonth()+1,0));
  const total=diff(a,b)+1,pct=d=>Math.max(0,Math.min(100,diff(a,d)/total*100));
  let months='';{let d=a;while(d<=b){const dt=parse(d);months+=`<div class="mline" style="left:${pct(d)}%"></div><div class="mlabel" style="left:${pct(d)}%">${dt.toLocaleDateString(undefined,{month:'short'})}${dt.getMonth()===0||d===a?' '+dt.getFullYear():''}</div>`;d=iso(new Date(dt.getFullYear(),dt.getMonth()+1,1))}}
  const lines=months.replace(/<div class="mlabel[^>]*>[^<]*<\/div>/g,'');

  const msRow=`<div class="rrow"><div class="rlabel"><b>Milestones</b></div><div class="rtrack" style="min-height:58px">${lines}${tl}${S.milestones.map(m=>{const r=msStatus(m);return `<button class="diamond ${r.cls==='bad'?'bad':r.cls==='ok'&&r.st==='Complete'?'ok':''}" style="left:${pct(m.date)}%" data-act="milestone" data-id="${m.id}" title="${esc(m.title)}: ${fmtD(m.date)}, ${r.st}" aria-label="${esc(m.title)}"></button><span class="dlabel" style="left:${pct(m.date)}%">${esc(m.title)}</span>`}).join('')}</div></div>`;
  const rows=[...S.epics].sort((x,y)=>x.start<y.start?-1:1).map(e=>{const p=epicProgress(e),ms=byId(S.milestones,e.milestoneId);const late=ms&&e.end>ms.date;
    return `<div class="rrow"><div class="rlabel"><button class="link" data-act="epic" data-id="${e.id}"><b>${esc(e.title)}</b></button><div class="small muted">${fmtD(e.start)} to ${fmtD(e.end)}, ${p.pct}% done${late?` <span class="chip bad">Ends after ${esc(ms.title)}</span>`:''}</div></div>
    <div class="rtrack">${lines}${tl}<button class="rbar" style="--ec:${esc(e.color)};left:${pct(e.start)}%;width:${Math.max(1,(diff(e.start,e.end)+1)/total*100)}%" data-act="epic" data-id="${e.id}" title="${esc(e.title)}: ${p.done} of ${p.tot} points done"><i style="width:${p.pct}%"></i><span>${esc(e.title)}</span></button></div></div>`}).join('');

    `<div class="panel roadwrap"><div class="road"><div class="rrow rhead"><div></div><div class="rtrack">${months}</div></div>${msRow}${rows}</div></div>`;
}

function vGantt(){
  const z=UI.gZoom;
  const zoom=`<div class="filters" style="margin:0">${[[12,'Quarter'],[22,'Month'],[36,'Week']].map(([v,l])=>`<button class="btn sm ${z===v?'pri':''}" data-act="gzoom" data-z="${v}">${l}</button>`).join('')}</div><button class="btn pri" data-act="new-ticket">New ticket</button>`;
  const dated=tickets().filter(t=>t.start&&t.due&&t.status!=='triage');
  if(!dated.length)return head('Timeline','A Gantt view of every ticket with a start and due date.',zoom)+`<div class="panel empty">No tickets have dates yet. Give a ticket a start and due date to see it here.</div>`;
  let min=dated.reduce((m,t)=>t.start<m?t.start:m,dated[0].start),max=dated.reduce((m,t)=>t.due>m?t.due:m,dated[0].due);
  if(TODAY<min)min=TODAY;min=addDays(min,-3);max=addDays(max,6);
  const days=diff(min,max)+1,LW=250,RH=35,HH=2*27,W=days*z;
  const groups=[...S.epics.map(e=>({e,ts:dated.filter(t=>t.epicId===e.id)})),{e:null,ts:dated.filter(t=>!t.epicId||!byId(S.epics,t.epicId))}].filter(g=>g.ts.length);
  const rows=[];groups.forEach(g=>{g.ts.sort((a,b)=>a.start<b.start?-1:a.start>b.start?1:byRank(a,b));rows.push({kind:'epic',e:g.e,ts:g.ts});g.ts.forEach(t=>rows.push({kind:'t',t}))});
  const rowIdx={};rows.forEach((r,i)=>{if(r.kind==='t')rowIdx[r.t.id]=i});
  let sprH='',dayH='';
  S.sprints.forEach(s=>{if(s.end<min||s.start>max)return;const l=Math.max(0,diff(min,s.start))*z,r=(Math.min(days-1,diff(min,s.end))+1)*z;sprH+=`<div class="gsprint" style="left:${l}px;width:${r-l}px" title="${esc(s.name)}">${esc(s.name)}</div>`});
  for(let i=0;i<days;i++){const d=addDays(min,i),dt=parse(d),we=dt.getDay()===0||dt.getDay()===6;const show=z>=30||dt.getDay()===1;dayH+=`<div class="gday${we?' we':''}" style="left:${i*z}px;width:${z}px">${show?(z>=30?dt.getDate():fmtD(d)):''}</div>`}
  const X=d=>LW+diff(min,d)*z;
  let conflicts=0,body='';
  rows.forEach(r=>{
    if(r.kind==='epic'){const s=r.ts.reduce((m,t)=>t.start<m?t.start:m,r.ts[0].start),e=r.ts.reduce((m,t)=>t.due>m?t.due:m,r.ts[0].due);
      body+=`<div class="grow epic"><div class="glabel">${r.e?`<span class="dot" style="background:${esc(r.e.color)}"></span><button class="link ttl" data-act="epic" data-id="${r.e.id}">${esc(r.e.title)}</button>`:'<span class="ttl">No epic</span>'}</div><div class="gtrack" style="width:${W}px"><div class="gsum" style="--ec:${r.e?esc(r.e.color):'var(--muted)'};left:${diff(min,s)*z}px;width:${(diff(s,e)+1)*z}px"></div></div></div>`}
    else{const t=r.t,late=!isDone(t)&&t.due<TODAY;
      body+=`<div class="grow"><div class="glabel"><span class="key">${esc(t.key)}</span><button class="link ttl" data-act="ticket" data-id="${t.id}" title="${esc(t.title)}">${esc(t.title)}</button><span class="sp" style="flex:1"></span>${av(t.assignee)}</div><div class="gtrack" style="width:${W}px"><div class="gbar s-${t.status}${late?' late':''}" data-gid="${t.id}" style="left:${diff(min,t.start)*z}px;width:${(diff(t.start,t.due)+1)*z-2}px" title="${esc(t.key+' '+t.title)}: ${fmtD(t.start)} to ${fmtD(t.due)}${late?' (overdue)':''}">${esc(t.key)}<i class="grip" aria-hidden="true"></i></div></div></div>`}
  });
  let svg='';
  S.sprints.forEach(s=>{if(s.start>=min&&s.start<=max)svg+=`<line x1="${X(s.start)}" x2="${X(s.start)}" y1="0" y2="${HH+rows.length*RH}" stroke="var(--muted)" stroke-opacity=".35"/>`});
  if(TODAY>=min&&TODAY<=max)svg+=`<line x1="${X(TODAY)+z/2}" x2="${X(TODAY)+z/2}" y1="0" y2="${HH+rows.length*RH}" stroke="var(--bad)" stroke-width="2"/>`;
  dated.forEach(t=>(t.deps||[]).forEach(pid=>{const p=T[pid];if(!p||rowIdx[pid]==null||rowIdx[t.id]==null)return;
    const bad=t.start<=p.due&&!isDone(p);if(bad)conflicts++;
    const x1=X(p.due)+z-2,y1=HH+rowIdx[pid]*RH+17,x2=X(t.start),y2=HH+rowIdx[t.id]*RH+17,mid=Math.max(x1+8,Math.min(x2-8,x1+8));
    svg+=`<path d="M${x1} ${y1} H${mid} V${y2} H${x2-2}" fill="none" stroke="${bad?'var(--bad)':'var(--muted)'}" stroke-width="1.6" marker-end="url(#${bad?'arB':'arA'})"/>`}));
  const defs=`<defs><marker id="arA" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--muted)"/></marker><marker id="arB" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--bad)"/></marker></defs>`;
  const note=conflicts?`<p class="signal bad" style="margin:0 0 12px">${plural(conflicts,'dependency conflict')}: a ticket starts before the ticket blocking it is due. Conflicting links are drawn in red.</p>`:'';
  return head('Timeline','Drag a bar to reschedule it, or drag its right edge to change the due date. Arrows show what blocks what.',zoom)+note+
   `<div class="gscroll"><div class="gantt" style="width:${LW+W}px"><div class="grow ghdr"><div class="glabel">Sprints</div><div class="gtrack" style="width:${W}px">${sprH}</div></div><div class="grow ghdr"><div class="glabel">Ticket</div><div class="gtrack" style="width:${W}px">${dayH}</div></div>${body}<svg class="gover" width="${LW+W}" height="${HH+rows.length*RH}">${defs}${svg}</svg></div></div>`;
}

    ${epicChip(t.epicId)||'<span></span>'}${pri(t.priority)}<span class="pts" title="Story points">${+t.points||0}</span>${av(t.assignee)}

function matchQ(t,q){if(!q)return true;q=q.toLowerCase();return (t.title+' '+t.key+' '+(t.labels||'')).toLowerCase().includes(q)}

  if(!opts.length)return head('Sprint planning','Size the next sprint against team capacity and recent velocity.',`<button class="btn pri" data-act="new-sprint">Create a sprint</button>`)+`<div class="panel empty">There are no open sprints. Create one to start planning.</div>`;
  let s=byId(opts,UI.planSprint)||opts.find(x=>x.status==='planned')||opts[0];UI.planSprint=s.id;
  const cap=sprintCap(s),v=velocity(),ts=sprintTickets(s.id).sort(byRank),p=pts(ts),scale=Math.max(cap,v,p,1)*1.15;
  let rec,cls;
  if(p>cap){rec=`Over capacity by ${plural(p-cap,'point')}. Move lower-ranked tickets back to the backlog.`;cls='bad'}
  else if(v&&p>v*1.1){rec=`Above recent velocity (${v}). The team has capacity on paper, but history says this is a stretch.`;cls='warn'}
  else if(v&&p<v*.8){rec=`Room for about ${plural(Math.min(v,cap)-p,'more point')} based on recent velocity.`;cls='warn'}
  else if(!v&&!p){rec='Add tickets from the backlog, or fill to capacity automatically.';cls='warn'}
  else {rec='This commitment looks realistic against capacity and velocity.';cls='ok'}
  const wd=workdays(s.start,s.end);
  const rows=S.members.map(m=>{const a=pts(ts.filter(t=>t.assignee===m.id)),c=memberAvail(m,s),off=(m.timeOff||{})[s.id]||0;
    return `<tr><td>${av(m.id)} ${esc(m.name)}<div class="small muted">${esc(m.role||'')}</div></td><td class="num">${+m.capacity||0}</td><td class="num"><input type="number" min="0" max="${wd}" value="${off}" data-chg="timeoff" data-m="${m.id}" data-s="${s.id}" aria-label="Days off for ${esc(m.name)}" style="width:62px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--sunk);text-align:right"></td><td class="num">${c}</td><td class="num">${a}</td><td style="min-width:140px">${meter(a,c)}</td></tr>`}).join('');
  const un=pts(ts.filter(t=>!t.assignee));
  const act=activeSprint();
  return head('Sprint planning','Size the sprint against what the team can actually take on. Capacity accounts for time off.',
   `<select class="selectlike" data-chg="plan-sprint" aria-label="Sprint">${opts.map(o=>`<option value="${o.id}"${o.id===s.id?' selected':''}>${esc(o.name)}${o.status==='active'?' (active)':''}</option>`).join('')}</select><button class="btn" data-act="new-sprint">New sprint</button>`)+
   `<div class="stack"><section class="panel"><div class="phead"><div><h2>${esc(s.name)}</h2><p class="small muted">${fmtD(s.start)} to ${fmtD(s.end)}, ${plural(wd,'working day')}. ${esc(s.goal||'No sprint goal yet.')}</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" data-act="sprint" data-id="${s.id}">Edit goal and dates</button><button class="btn sm" data-act="autofill" data-id="${s.id}">Fill from backlog</button>${s.status==='planned'&&!act?`<button class="btn sm pri" data-act="start-sprint" data-id="${s.id}">Start sprint</button>`:''}</div></div>
     <div class="gauge"><i class="${p>cap?'over':''}" style="width:${p/scale*100}%"></i>${v?`<div class="gmark top" style="left:${v/scale*100}%"><span>Velocity ${v}</span></div>`:''}<div class="gmark bot" style="left:${cap/scale*100}%"><span>Capacity ${cap}</span></div></div>
     <p><b style="font-size:1.3rem">${p}</b> <span class="muted">points committed across ${plural(ts.length,'ticket')}</span></p><p class="signal ${cls}">${esc(rec)}</p></section>
   <div class="grid2"><section class="panel"><h2>Capacity by teammate</h2><div class="tblwrap"><table><thead><tr><th>Teammate</th><th class="num">Pts/sprint</th><th class="num">Days off</th><th class="num">Available</th><th class="num">Assigned</th><th>Load</th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="muted">Add teammates on the Team capacity page.</td></tr>'}${un?`<tr><td class="muted">Unassigned</td><td></td><td></td><td></td><td class="num">${un}</td><td></td></tr>`:''}</tbody></table></div></section>
   <section class="panel bsec" data-drop="sprint:${s.id}" style="align-self:start"><div class="bhead"><h2>In this sprint</h2><span class="sp"></span><button class="btn sm ghost" data-act="go" data-v="backlog">Open backlog</button></div>${ts.length?ts.map(tRow).join(''):'<div class="empty">No tickets yet.</div>'}</section></div></div>`;
}

function vTickets(){

  const tri=ts.filter(t=>t.status==='triage'),bugs=ts.filter(t=>t.type==='bug'&&!isDone(t)),feats=ts.filter(t=>t.type==='feature'&&!isDone(t));
  const top=[...feats].sort((a,b)=>(b.votes||0)-(a.votes||0))[0];
  if(f.type!=='all')ts=ts.filter(t=>t.type===f.type);
  if(f.status==='open')ts=ts.filter(t=>!isDone(t));else if(f.status==='triage')ts=ts.filter(t=>t.status==='triage');else if(f.status==='done')ts=ts.filter(isDone);

   ${ts.map(t=>`<tr><td class="key">${esc(t.key)}</td><td>${ttag(t)}</td><td><button class="link" data-act="ticket" data-id="${t.id}">${esc(t.title)}</button></td><td>${t.type==='bug'?sevChip(t.severity):`<span class="chip feat">${+t.votes||0} votes</span>`}</td><td>${pri(t.priority)}</td><td><span class="chip ${t.status==='triage'?'warn':isDone(t)?'ok':''}">${STL[t.status]}</span></td><td class="small">${esc(t.reporter||'—')}</td><td class="small muted">${fmtD(t.createdAt)}</td>
   <td style="white-space:nowrap">${t.status==='triage'?`<button class="btn sm pri" data-act="accept" data-id="${t.id}">Accept to backlog</button>`:''}${t.type==='feature'&&!isDone(t)?` <button class="btn sm" data-act="vote" data-id="${t.id}" aria-label="Add a vote">+1</button>`:''}</td></tr>`).join('')||'<tr><td colspan="9" class="empty">Nothing matches these filters.</td></tr>'}

function vRisks(){
  const open=S.risks.filter(r=>r.status!=='closed');
  const cnt=(l,i)=>open.filter(r=>+r.likelihood===l&&+r.impact===i).length;
  let grid='';for(let l=3;l>=1;l--){grid+=`<div class="raxis">${['','Low','Med','High'][l]}</div>`;for(let i=1;i<=3;i++){const s=l*i,n=cnt(l,i);grid+=`<div class="rcell ${s>=6?'s3':s>=3?'s2':'s1'} ${n?'':'zero'}" title="Likelihood ${l}, impact ${i}">${n}</div>`}}
  grid+=`<div></div><div class="raxis">Low</div><div class="raxis">Med</div><div class="raxis">High</div>`;
  const rs=[...S.risks].map(r=>({...r,score:r.likelihood*r.impact})).sort((a,b)=>(a.status==='closed')-(b.status==='closed')||b.score-a.score);
  return head('Risks','A RAID log: risks, assumptions, issues, and dependencies. Score is likelihood times impact, each rated 1 to 3.',`<button class="btn pri" data-act="new-risk">Log an item</button>`)+
   `<div class="grid2" style="grid-template-columns:minmax(260px,380px) minmax(0,1fr)"><section class="panel"><h2>Open items by likelihood and impact</h2><div style="display:flex;gap:8px;align-items:center"><div class="raxis" style="writing-mode:vertical-rl;transform:rotate(180deg)">Likelihood</div><div class="rgrid" style="flex:1">${grid}</div></div><p class="raxis" style="margin-top:4px">Impact</p></section>
   <section class="panel tblwrap"><table><thead><tr><th>Score</th><th>Type</th><th>Item</th><th>Owner</th><th>Status</th></tr></thead><tbody>${rs.map(r=>`<tr><td><span class="chip ${r.status==='closed'?'':r.score>=6?'bad':r.score>=3?'warn':'ok'}">${r.score}</span></td><td class="small">${esc((RAID.find(x=>x[0]===r.kind)||[,'Risk'])[1])}</td><td><button class="link" data-act="risk" data-id="${r.id}">${esc(r.title)}</button>${r.mitigation?`<div class="small muted">${esc(r.mitigation)}</div>`:''}</td><td class="small">${r.owner&&member(r.owner)?esc(member(r.owner).name):'—'}</td><td class="small">${esc({open:'Open',mitigating:'Mitigating',closed:'Closed'}[r.status]||r.status)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nothing logged yet.</td></tr>'}</tbody></table></section></div>`;
}

function weekStart(d){const dt=parse(d);const w=(dt.getDay()+6)%7;return addDays(d,-w)}
function vReports(){
  const closed=sortedSprints().filter(s=>s.status==='closed').slice(-8),v=velocity();
  const vel=closed.length?svgBars({groups:closed.map(s=>({label:s.name.replace('Sprint ','S'),vals:[{v:+s.committed||0,color:'color-mix(in srgb,var(--accent) 30%,var(--panel))'},{v:+s.completed||0,color:'var(--accent)'}]})),avg:v,ymax:Math.max(...closed.map(s=>Math.max(+s.committed||0,+s.completed||0)),1)})+legend([['color-mix(in srgb,var(--accent) 30%,var(--panel))','Committed'],['var(--accent)','Completed']]):'<p class="muted">Complete a sprint to start building velocity history.</p>';
  const sayDo=closed.length?Math.round(closed.reduce((a,s)=>a+(+s.completed||0),0)/Math.max(1,closed.reduce((a,s)=>a+(+s.committed||0),0))*100):null;
  const bOpts=sortedSprints().filter(s=>s.status!=='planned');
  const rs=byId(bOpts,UI.reportSprint)||activeSprint()||bOpts[bOpts.length-1];
  let bd='<p class="muted">No sprint history yet.</p>';
  if(rs){UI.reportSprint=rs.id;const len=diff(rs.start,rs.end)+1,b=burn(rs),c=+rs.committed||pts(sprintTickets(rs.id));bd=svgLine({labels:[...Array(len)].map((_,i)=>fmtD(addDays(rs.start,i))),series:[{vals:[...Array(len)].map((_,i)=>c*(1-i/(len-1))),color:'var(--muted)',dash:true,name:'Ideal'},{vals:b,color:'var(--accent)',dots:true,name:'Remaining'}],ymax:Math.max(c,...b,1)})+legend([['var(--accent)','Points remaining'],['var(--muted)','Ideal',1]])}
  const wk0=weekStart(addDays(TODAY,-49)),weeks=[...Array(8)].map((_,i)=>addDays(wk0,i*7));
  const bugs=tickets().filter(t=>t.type==='bug');
  const opened=weeks.map(w=>bugs.filter(b=>b.createdAt>=w&&b.createdAt<addDays(w,7)).length),fixed=weeks.map(w=>bugs.filter(b=>b.doneAt&&b.doneAt>=w&&b.doneAt<addDays(w,7)).length);
  const recent=tickets().filter(t=>isDone(t)&&t.doneAt>=addDays(TODAY,-42)&&t.startedAt);
  const cycle=recent.length?(recent.reduce((a,t)=>a+diff(t.startedAt,t.doneAt)+1,0)/recent.length).toFixed(1):'—';
  const thr=Math.round(pts(tickets().filter(t=>isDone(t)&&t.doneAt>=addDays(TODAY,-28)))/4);
  const bl=tickets().filter(t=>!isDone(t)&&t.status!=='triage'),remAll=pts(bl);
  const a=activeSprint(),eta=v?addDays(a?a.start:TODAY,Math.ceil(remAll/v)*14-1):null;
  return head('Reports','Delivery health across sprints.',tickets().length?`<button class="btn" data-act="export">Export tickets as CSV</button>`:'')+
   `<div class="tiles"><div class="tile"><b>${v||'—'}</b><span>average velocity, last 3 sprints</span></div><div class="tile"><b>${sayDo==null?'—':sayDo+'%'}</b><span>say/do ratio: completed vs committed</span></div><div class="tile"><b>${cycle}</b><span>average cycle time in days, last 6 weeks</span></div><div class="tile"><b>${thr}</b><span>points finished per week, last 4 weeks</span></div><div class="tile"><b>${eta?fmtD(eta):'—'}</b><span>forecast to clear all ${remAll} open points</span></div></div>
   <div class="grid2"><section class="panel"><h2>Velocity</h2>${vel}</section>
   <section class="panel"><div class="phead"><h2>Burndown</h2>${bOpts.length?`<select class="selectlike" data-chg="report-sprint" aria-label="Sprint">${bOpts.map(o=>`<option value="${o.id}"${rs&&o.id===rs.id?' selected':''}>${esc(o.name)}</option>`).join('')}</select>`:''}</div>${bd}</section>
   <section class="panel"><h2>Bugs opened and fixed per week</h2>${svgLine({labels:weeks.map(fmtD),series:[{vals:opened,color:'var(--bad)',dots:true,name:'Opened'},{vals:fixed,color:'var(--ok)',dots:true,name:'Fixed'}],ymax:Math.max(...opened,...fixed,2)})}${legend([['var(--bad)','Opened'],['var(--ok)','Fixed']])}</section>
   <section class="panel"><h2>Open work by status</h2><ul class="list1">${STATUSES.filter(([k])=>k!=='done').map(([k,l])=>{const ts=tickets().filter(t=>t.status===k),p=pts(ts),mx=Math.max(1,pts(tickets().filter(t=>!isDone(t))));return `<li><span style="width:90px" class="small">${l}</span><div class="sp">${meter(p,mx)}</div><span class="small muted" style="width:80px;text-align:right">${plural(ts.length,'ticket')}</span></li>`}).join('')}</ul></section></div>`;
}

/* ---------- sprint lifecycle ---------- */
function startSprint(id){const s=byId(S.sprints,id);if(activeSprint()){toast('Complete the active sprint before starting another.');return}
  const ts=sprintTickets(id);if(!ts.length){toast('Add tickets to this sprint before starting it.');return}
  s.status='active';s.committed=pts(ts);if(s.start>TODAY){const len=diff(s.start,s.end);s.start=TODAY;s.end=addDays(TODAY,len)}saveWs();UI.view='board';render();toast(`${s.name} started with ${s.committed} points`)}
function completeSprint(id){const s=byId(S.sprints,id),ts=sprintTickets(id),open=ts.filter(t=>!isDone(t));
  const next=sortedSprints().find(x=>x.status==='planned'&&x.start>=s.start&&x.id!==id);
  confirmBox(`Complete ${s.name}?`,`${pts(ts.filter(isDone))} of ${pts(ts)} points are done. ${open.length?`${plural(open.length,'unfinished ticket')} will move to ${next?esc(next.name):'the backlog'}.`:'Everything is finished.'}`,'Complete sprint',()=>{
    s.burn=burn(s);s.completed=pts(ts.filter(isDone));s.committed=+s.committed||pts(ts);s.status='closed';
    open.forEach(t=>{const c=clone(t);moveToSprint(c,next?next.id:null);if(next&&c.status==='backlog')c.status='todo';saveT(c)});
    saveWs();render();toast(`${s.name} completed: ${s.completed} points`)})}
function autofill(id){const s=byId(S.sprints,id),cap=sprintCap(s),v=velocity(),target=v?Math.min(v,cap||v):cap;
  let cur=pts(sprintTickets(id)),n=0,added=0;
  if(!target){toast('Add teammates or finish a sprint so there’s a capacity to fill to.');return}
  tickets().filter(t=>!t.sprintId&&t.status==='backlog').sort(byRank).forEach(t=>{const p=+t.points||0;if(cur+p<=target){const c=clone(t);moveToSprint(c,id);saveT(c);cur+=p;n++;added+=p}});
  render();toast(n?`Added ${plural(n,'ticket')} (${added} pts) up to a target of ${target}`:`Nothing else fits under the target of ${target} points`)}

/* ---------- export ---------- */
function exportCsv(){
  const cols=['key','type','title','status','priority','severity','points','assignee','sprint','epic','start','due','votes','createdAt','doneAt'];
  const q=v=>{let s=String(v??'');if(/^[=+\-@]/.test(s))s="'"+s;return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const rows=tickets().sort((a,b)=>(+a.key.split('-')[1])-(+b.key.split('-')[1])).map(t=>cols.map(c=>q(c==='assignee'?(member(t.assignee)||{}).name:c==='sprint'?(byId(S.sprints,t.sprintId)||{}).name:c==='epic'?(byId(S.epics,t.epicId)||{}).title:t[c])).join(','));
  const blob=new Blob(['\ufeff'+[cols.join(','),...rows].join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=S.project.key.toLowerCase()+'-tickets-'+TODAY+'.csv';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast('Exported '+plural(rows.length,'ticket'));
}

function seed(data){

  return '<section class="panel welcome"><p class="small muted">Welcome to Throughline</p>'+
  '<h1>Plan the work. See the path to launch.</h1>'+
  '<p class="lead">Throughline is a project planning tool that keeps the roadmap, the sprint, and delivery health in one place, so you can tell early whether a milestone is still reachable.</p>'+
  '<div class="row"><button class="btn pri lg" data-act="new-project">Create your first project</button></div>'+
  '<ul class="wfeat">'+
  '<li><b>Roadmap and milestones</b><span>Epics over time, with each milestone forecast from real velocity.</span></li>'+
  '<li><b>Backlog and sprint planning</b><span>Rank by dragging, then size the sprint against capacity net of time off.</span></li>'+
  '<li><b>Sprint board</b><span>Kanban columns with a work-in-progress limit and blocked-ticket flags.</span></li>'+
  '<li><b>Timeline</b><span>A draggable Gantt with dependency arrows that turn red on conflicts.</span></li>'+
  '<li><b>Risk log</b><span>A RAID log with a likelihood and impact matrix.</span></li>'+
  '<li><b>Reports</b><span>Velocity, burndown, say/do ratio, cycle time, and bug flow, plus CSV export.</span></li>'+
  '</ul>'+
  '<p class="small muted fine">Everything you enter is saved in this browser only. Nothing is sent to a server.</p></section>';
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,id=el.dataset.id;
  switch(a){
    case 'go':UI.view=el.dataset.v;closeModal();render();$('#mainwrap').scrollTop=0;break;
    case 'close':closeModal();break;
    case 'form-del':{const f=FORM;if(f&&f.onDelete){closeModal();f.onDelete()}break}
    case 'ticket':openTicket(id);break;
    case 'new-ticket':{const p={};if(el.dataset.type){p.type=el.dataset.type;p.status='triage';p.points=0;p.priority=el.dataset.type==='bug'?'P1':'P2';if(p.type==='bug')p.severity='major'}if(el.dataset.sprint){p.sprintId=el.dataset.sprint;p.status='todo'}openTicket(null,p);break}
    case 'epic':openEpic(id);break;case 'new-epic':openEpic();break;
    case 'milestone':openMilestone(id);break;case 'new-milestone':openMilestone();break;
    case 'risk':openRisk(id);break;case 'new-risk':openRisk();break;
    case 'member':openMember(id);break;case 'new-member':openMember();break;
    case 'sprint':openSprint(id);break;case 'new-sprint':openSprint();break;
    case 'settings':openSettings();break;
    case 'new-project':openNewProject();break;
    case 'open-project':switchProject(id);UI.view='dashboard';closeModal();render();$('#mainwrap').scrollTop=0;break;
    case 'start-sprint':startSprint(id);break;case 'complete-sprint':completeSprint(id);break;
    case 'autofill':autofill(id);break;
    case 'accept':{const c=clone(T[id]);c.status='backlog';c.rank=maxRank()+1;if(!c.points)c.points=3;saveT(c);render();toast(`${c.key} moved to the backlog`);break}
    case 'vote':{const c=clone(T[id]);c.votes=(+c.votes||0)+1;saveT(c);render();break}
    case 'gzoom':UI.gZoom=+el.dataset.z;render();break;
    case 'export':exportCsv();break;
  }
});
function onChg(e){
  const el=e.target;const k=el.dataset&&el.dataset.chg;if(!k)return;
  if(k==='bq'){UI.bq=el.value;render()}
  else if(k==='tq'){UI.tf.q=el.value;render()}
  else if(e.type!=='change')return;
  else if(k==='tf'){UI.tf[el.dataset.k]=el.value;render()}
  else if(k==='move-sprint'){const c=clone(T[el.dataset.id]);moveToSprint(c,el.value);c.rank=maxRank()+1;saveT(c);render();toast(`${c.key} moved to ${el.value?byId(S.sprints,el.value).name:'the backlog'}`)}
  else if(k==='board-who'){UI.boardWho=el.value;render()}
  else if(k==='plan-sprint'){UI.planSprint=el.value;render()}
  else if(k==='switch-project'){switchProject(el.value);if(UI.view==='portfolio')UI.view='dashboard';render();$('#mainwrap').scrollTop=0}
  else if(k==='report-sprint'){UI.reportSprint=el.value;render()}
  else if(k==='timeoff'){const m=member(el.dataset.m);m.timeOff=m.timeOff||{};m.timeOff[el.dataset.s]=Math.max(0,+el.value||0);saveWs();render()}
}
document.addEventListener('input',onChg);document.addEventListener('change',onChg);
document.addEventListener('submit',e=>{if(e.target.id!=='dlgForm')return;e.preventDefault();const fd=new FormData(e.target),out={};
  FORM.fields.forEach(f=>{let v=fd.get(f.k);if(f.type==='number')v=v===''||v==null?0:Number(v);out[f.k]=v??''});const f=FORM;if(f.onSave(out)!==false&&FORM===f)closeModal()});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#modal').hidden){closeModal();return}
  const tag=(e.target.tagName||'').toLowerCase();
  if(S&&UI.view!=='portfolio'&&$('#modal').hidden&&(e.key==='n'||e.key==='N')&&!e.metaKey&&!e.ctrlKey&&!['input','textarea','select'].includes(tag)){e.preventDefault();openTicket()}
});

/* drag and drop: backlog rows and board cards */
document.addEventListener('dragstart',e=>{const el=e.target.closest&&e.target.closest('[data-drag]');if(!el)return;UI.dragId=el.dataset.drag;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',UI.dragId)}catch(_){}el.classList.add('dragging')});
document.addEventListener('dragend',()=>{UI.dragId=null;document.querySelectorAll('.dragging,.over-drop,.drop-before').forEach(x=>x.classList.remove('dragging','over-drop','drop-before'))});
document.addEventListener('dragover',e=>{if(!UI.dragId)return;const z=e.target.closest('[data-drop]');if(!z)return;e.preventDefault();
  document.querySelectorAll('.over-drop,.drop-before').forEach(x=>{if(x!==z)x.classList.remove('over-drop','drop-before')});z.classList.add('over-drop');
  const row=e.target.closest('[data-rowid]');if(row&&row.dataset.rowid!==UI.dragId)row.classList.add('drop-before')});
document.addEventListener('drop',e=>{const z=e.target.closest('[data-drop]');if(!z||!UI.dragId)return;e.preventDefault();
  const id=UI.dragId,row=e.target.closest('[data-rowid]'),t=clone(T[id]);if(!t)return;const tgt=z.dataset.drop;
  if(tgt.startsWith('status:')){setStatus(t,tgt.slice(7));}
  else{const sid=tgt==='backlog'?null:tgt.slice(7);moveToSprint(t,sid);
    const list=tickets().filter(x=>x.id!==id&&(sid?x.sprintId===sid:(!x.sprintId&&x.status!=='triage'&&!isDone(x)))).sort(byRank);
    const before=row&&row.dataset.rowid!==id?list.findIndex(x=>x.id===row.dataset.rowid):-1;
    if(before>=0){const b=list[before],p=list[before-1];t.rank=p?((+p.rank||0)+(+b.rank||0))/2:(+b.rank||0)-1}else t.rank=(list.length?Math.max(...list.map(x=>+x.rank||0)):0)+1;}
  saveT(t);UI.dragId=null;render()});

/* gantt bar drag */
let GD=null,pendingRender=false;
document.addEventListener('pointerdown',e=>{const b=e.target.closest('.gbar[data-gid]');if(!b||e.button>0)return;e.preventDefault();
  try{b.setPointerCapture(e.pointerId)}catch(_){}
  GD={id:b.dataset.gid,b,x0:e.clientX,left:parseFloat(b.style.left),width:parseFloat(b.style.width),mode:e.target.classList.contains('grip')?'resize':'move',moved:false}});
document.addEventListener('pointermove',e=>{if(!GD)return;const dx=e.clientX-GD.x0,z=UI.gZoom;if(Math.abs(dx)>3)GD.moved=true;const snap=Math.round(dx/z)*z;
  if(GD.mode==='move')GD.b.style.left=(GD.left+snap)+'px';else GD.b.style.width=Math.max(z-2,GD.width+snap)+'px'});
function endDrag(e){if(!GD)return;const g=GD;GD=null;const dd=Math.round((e.clientX-g.x0)/UI.gZoom);
  if(!g.moved){pendingRender=false;openTicket(g.id);return}
  const t=clone(T[g.id]);if(t&&dd){if(g.mode==='move'){t.start=addDays(t.start,dd);t.due=addDays(t.due,dd)}else{t.due=addDays(t.due,dd);if(t.due<t.start)t.due=t.start}saveT(t);toast(`${t.key}: ${fmtD(t.start)} to ${fmtD(t.due)}`)}
  pendingRender=false;render()}
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',e=>{if(GD){GD=null;render()}});

/* ---------- boot ---------- */
function init(){localLoad();render()}
init();
</script>
</body>
</html>
